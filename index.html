<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAVY'S MAP EXPLORER v3.17</title>
<link rel="icon" type="image/png" href="brand-image.png">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Knewave&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f2ec;
    --panel:#ffffff;
    --ink:#171717;
    --muted:#696969;
    --line:#2d2d2d;
    --soft:#d7d4cc;
    --accent:#1d4f8c;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family: ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); }
  body { overflow:hidden; background:var(--bg); }
  #app { display:grid; grid-template-columns:310px 1fr; grid-template-rows:82px 1fr; height:100%; }
  header {
    grid-column:1 / -1;
    background:#ffffff;
    color:#111111;
    display:flex;
    align-items:center;
    padding:0 22px;
    min-height:82px;
    overflow:visible;
    border-bottom:1px solid #e5e5e5;
  }

  .brand-image {
    display:block;
    width:58px;
    height:58px;
    object-fit:contain;
    flex:0 0 auto;
    margin-right:16px;
  }

  .brand-title {
    font-family:'Bowlby One','Cooper Black','Arial Black',sans-serif;
    font-size:29px;
    font-weight:400;
    letter-spacing:.015em;
    line-height:1;

    color:#FFD52F;
    -webkit-text-stroke:2px #111111;
    paint-order:stroke fill;

    /* stronger hard offset shadow */
    text-shadow:
      -1px 1px 0 #111111,
      -2px 2px 0 #111111,
      -3px 3px 0 #111111,
      -4px 4px 0 #111111,
      -5px 5px 0 #111111,
      -6px 6px 0 #111111,
      -7px 7px 0 #111111,
      -8px 8px 0 #111111;
  }
  .version-tag {
    font-family:'Knewave', cursive;
    font-size:14px;
    font-weight:400;
    letter-spacing:.01em;
    margin-left:16px;
    color:#111111;
    opacity:.62;
    align-self:center;
    transform:translateY(3px);
  }
  #sidebar { background:var(--panel); border-right:1px solid #ddd; padding:18px; overflow:auto; }
  #map { width:100%; height:100%; }
  .eyebrow { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:800; margin-bottom:6px; }
  .group { margin-bottom:20px; }
  label { font-size:12px; font-weight:750; display:block; margin:0 0 6px; }
  select,button,input[type="text"] {
    width:100%; border:1px solid #c9c9c9; background:white; border-radius:7px; padding:9px 10px;
    font:inherit; font-size:13px;
  }
  button { cursor:pointer; font-weight:750; }
  input[type="text"] { outline:none; }
  input[type="text"]:focus { border-color:#171717; box-shadow:0 0 0 2px rgba(23,23,23,.08); }
  .search-row { display:grid; grid-template-columns:1fr 72px; gap:7px; }
  .search-row button { padding-left:7px; padding-right:7px; }
  .address-meta { min-height:17px; margin-top:7px; font-size:11px; color:var(--muted); line-height:1.35; }
  .address-meta.is-error { color:#9f231c; font-weight:700; }
  .address-clear { width:auto; border:0; background:transparent; padding:2px 0; margin-top:4px; border-radius:0; font-size:11px; text-decoration:underline; text-underline-offset:2px; display:none; }
  .address-clear:hover { background:transparent; }

  /* Custom address/place pin: Explorer yellow, intentionally icon-free. */
  .address-marker { width:48px; height:58px; position:relative; cursor:pointer; filter:drop-shadow(-2px 3px 0 rgba(0,0,0,.18)); }
  .address-marker-pin {
    position:absolute; left:5px; top:0; width:38px; height:38px;
    background:#FFD52F; border:3px solid #111; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg); transform-origin:50% 50%;
  }
  .address-marker-dot {
    position:absolute; left:21px; bottom:0; width:6px; height:6px; border-radius:50%;
    background:#111; opacity:.18;
  }
  .address-popup-name { font-weight:850; font-size:13px; margin-bottom:2px; }
  .address-popup-sub { font-size:11px; line-height:1.35; color:#555; }
  .address-popup-source { color:#777; font-size:10px; margin-top:4px; }
  .address-results { display:none; margin-top:7px; border:1px solid #d7d7d7; border-radius:7px; overflow:hidden; background:#fff; }
  .address-results.is-open { display:block; }
  .address-result {
    display:block; width:100%; border:0; border-bottom:1px solid #e8e8e8; border-radius:0;
    padding:9px 10px; background:#fff; text-align:left; font-weight:400; cursor:pointer;
  }
  .address-result:last-child { border-bottom:0; }
  .address-result:hover, .address-result:focus { background:#f5f5f5; outline:none; }
  .address-result.is-selected { background:#fff8d4; }
  .address-result-title { display:block; font-size:12px; font-weight:850; color:#151515; line-height:1.25; }
  .address-result-sub { display:block; font-size:10px; color:#666; line-height:1.3; margin-top:2px; }

  button:hover { background:#f3f3f3; }
  .checkrow { display:flex; align-items:center; gap:8px; font-size:13px; margin-top:8px; }
  .checkrow input { width:auto; }
  .toggle-only { display:flex; align-items:center; height:26px; }
  .toggle-only input { width:38px; height:21px; appearance:none; -webkit-appearance:none; border-radius:999px; background:#c9c9c9; position:relative; cursor:pointer; transition:.16s ease; margin:0; }
  .toggle-only input::after { content:''; position:absolute; width:17px; height:17px; left:2px; top:2px; border-radius:50%; background:white; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:.16s ease; }
  .toggle-only input:checked { background:#171717; }
  .toggle-only input:checked::after { transform:translateX(17px); }

  .slider-row { margin-top:10px; }
  .slider-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .slider-head label { margin:0; }
  .slider-value { font-size:12px; font-weight:800; color:var(--muted); }
  input[type="range"] { width:100%; accent-color:#171717; }
  input[type="range"]:disabled { opacity:.38; cursor:not-allowed; }
  #status {
    font-size:12px; color:var(--muted); line-height:1.45; padding:11px; background:#f5f5f3; border-radius:7px;
  }
  #legend { margin-top:12px; display:none; }
  .legend-title { font-size:12px; font-weight:800; margin-bottom:7px; }
  .legend-row { display:grid; grid-template-columns:24px 1fr; align-items:center; gap:7px; font-size:11px; margin:4px 0; }
  .swatch { height:13px; border:1px solid rgba(0,0,0,.2); border-radius:2px; }
  .hint { font-size:11px; color:var(--muted); line-height:1.45; }
  .maplibregl-popup-content {
    font:12px/1.4 ui-sans-serif,system-ui,sans-serif;
    min-width:190px;
    max-width:calc(100vw - 24px);
    box-sizing:border-box;
    padding:14px 42px 14px 14px;
    border-radius:8px;
  }
  .maplibregl-popup-close-button {
    top:7px;
    right:7px;
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    border-radius:5px;
    font-size:21px;
    line-height:1;
    color:#171717;
    background:rgba(255,255,255,.94);
  }
  .maplibregl-popup-close-button:hover {
    background:#ececec;
  }
  .popup-title {
    font-weight:850;
    font-size:14px;
    margin-bottom:6px;
    padding-right:4px;
  }
  .popup-grid { display:grid; grid-template-columns:1fr auto; gap:3px 12px; }
  .popup-grid .v { font-weight:750; text-align:right; }
  .wfp-popup { margin-top:9px; padding-top:8px; border-top:1px solid #e3e3e3; }
  .wfp-cycle { display:grid; grid-template-columns:42px 1fr auto; gap:3px 9px; align-items:baseline; margin-top:5px; }
  .wfp-year { font-weight:900; grid-row:span 2; }
  .wfp-name { font-size:11px; }
  .wfp-rank { font-weight:900; text-align:right; }
  .rank-win { color:#247a35; }
  .rank-loss { color:#b42f2f; }
  .rank-missing { color:#777; }
  .wfp-shift { display:flex; justify-content:space-between; gap:12px; margin-top:8px; padding-top:6px; border-top:1px solid #ececec; font-size:11px; }
  .shift-improved { color:#247a35; font-weight:900; }
  .shift-declined { color:#b42f2f; font-weight:900; }
  .shift-neutral { color:#555; font-weight:900; }
  .rabb-popup { margin-top:9px; padding-top:8px; border-top:1px solid #e3e3e3; }
  .rabb-popup-head { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:#666; font-weight:850; margin-bottom:6px; }
  .rabb-columns { display:grid; grid-template-columns:42px minmax(92px,1fr) 56px 58px; gap:5px 8px; font-size:9px; text-transform:uppercase; letter-spacing:.04em; color:#888; padding-bottom:3px; border-bottom:1px solid #dedede; }
  .rabb-columns span:nth-child(3), .rabb-columns span:nth-child(4) { text-align:right; }
  .rabb-row { display:grid; grid-template-columns:42px minmax(92px,1fr) 56px 58px; gap:5px 8px; align-items:baseline; padding:3px 0; border-bottom:1px solid #f0f0f0; }
  .rabb-row:last-child { border-bottom:0; }
  .rabb-row.is-rabb { font-weight:900; }
  .rabb-rank { font-weight:900; color:#4F3B83; }
  .rabb-name { font-size:11px; }
  .rabb-pct { font-weight:850; text-align:right; }
  .rabb-votes { font-size:10px; color:#555; text-align:right; white-space:nowrap; }
  .rabb-writein { color:#666; }
  .polling-popup-address { font-size:11px; line-height:1.35; color:#444; margin-top:2px; }
  .polling-popup-label { margin-top:9px; padding-top:7px; border-top:1px solid #e3e3e3; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:#777; font-weight:850; }
  .polling-popup-divisions { margin-top:4px; font-size:11px; line-height:1.45; font-weight:750; }
  .area-performance { display:none; margin-top:12px; padding-top:11px; border-top:2px solid #111; }
  .area-performance.is-visible { display:block; }
  .area-performance-head { font-size:10px; letter-spacing:.09em; text-transform:uppercase; font-weight:900; color:#111; margin-bottom:3px; }
  .area-performance-area { font-size:13px; line-height:1.25; font-weight:900; margin-bottom:7px; }
  .area-performance-sub { font-size:9px; line-height:1.35; letter-spacing:.055em; text-transform:uppercase; color:#666; margin-bottom:8px; }
  .area-columns { display:grid; grid-template-columns:34px minmax(90px,1fr) 51px 54px; gap:4px 6px; font-size:8px; text-transform:uppercase; letter-spacing:.035em; color:#777; padding-bottom:3px; border-bottom:1px solid #d7d7d7; }
  .area-columns span:nth-child(3), .area-columns span:nth-child(4) { text-align:right; }
  .area-row { display:grid; grid-template-columns:34px minmax(90px,1fr) 51px 54px; gap:4px 6px; align-items:baseline; padding:4px 0; border-bottom:1px solid #ededed; }
  .area-row:last-child { border-bottom:0; }
  .area-rank { font-size:10px; font-weight:900; color:#4F3B83; }
  .area-name { font-size:10px; line-height:1.2; font-weight:760; }
  .area-pct { font-size:10px; text-align:right; font-weight:850; }
  .area-votes { font-size:9px; text-align:right; color:#555; white-space:nowrap; }
  .area-highlight { font-weight:950; }
  .area-note { margin-top:7px; font-size:9px; line-height:1.35; color:#686868; }
  .area-stat-grid { display:grid; grid-template-columns:1fr auto; gap:5px 9px; font-size:10px; }
  .area-stat-grid .v { font-weight:900; text-align:right; }
  .bh16-popup { margin-top:9px; padding-top:8px; border-top:1px solid #e3e3e3; }
  .bh16-popup-head { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:#666; font-weight:850; margin-bottom:6px; }
  .bh16-crosswalk-note { margin-top:6px; font-size:9px; line-height:1.35; color:#777; }
  @media (max-width:760px) {
    #app { grid-template-columns:1fr; grid-template-rows:72px auto 1fr; }
    header { grid-column:1; }
    #sidebar { border-right:0; border-bottom:1px solid #ddd; display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; max-height:42vh; }
    .group { margin:0; }
    .brand-title { font-size:24px; -webkit-text-stroke:1.6px #111111; }
    /* Keep the address Find button readable on mobile browsers that override button text color. */
    .search-row button {
      background:#fff; color:#111; -webkit-text-fill-color:#111; border-color:#9d9d9d;
      -webkit-appearance:none; appearance:none; opacity:1;
    }
    .search-row button:disabled {
      background:#f2f2f2; color:#666; -webkit-text-fill-color:#666; opacity:1;
    }
  }

  /* Lightweight in-browser polygon sketch controls. No persistence or data collection. */
  .maplibregl-ctrl.draw-ctrl { overflow:hidden; }
  .draw-ctrl button {
    width:34px; height:34px; min-width:34px; padding:0; border:0; border-radius:0;
    background:#fff; color:#171717; font:800 17px/34px ui-sans-serif,system-ui,sans-serif;
    display:block; text-align:center; box-shadow:none;
  }
  .draw-ctrl button + button { border-top:1px solid #ddd; }
  .draw-ctrl button:hover { background:#f3f3f3; }
  .draw-ctrl button.is-active { background:#FFD52F; color:#111; }
  .draw-ctrl button:disabled { color:#aaa; background:#f7f7f7; cursor:default; }
  .draw-ctrl .draw-clear { font-size:15px; }

</style>
</head>
<body>
<div id="app">
  <header>
    <img
      class="brand-image"
      src="brand-image.png"
      alt=""
      onerror="this.style.display='none'"
    >
    <span class="brand-title">DAVY'S MAP EXPLORER</span>
    <span class="version-tag">v3.17</span>
  </header>
  <aside id="sidebar">
    <div class="group">
      <div class="eyebrow">LOOKUP</div>
      <form id="addressForm" autocomplete="off">
        <div class="search-row">
          <input id="addressInput" type="text" aria-label="Lookup Philadelphia address or place" spellcheck="false">
          <button id="addressSearchBtn" type="submit">Find</button>
        </div>
      </form>
      <div id="addressMeta" class="address-meta"></div>
      <button id="addressClearBtn" class="address-clear" type="button">Clear pin</button>
    </div>

    <div class="group">
      <div class="eyebrow">Geography</div>
      <label for="geoType">Area type</label>
      <select id="geoType">
        <option value="citywide" selected>Citywide</option>
        <option value="city_council">City Council District</option>
        <option value="pa_house">PA House District</option>
        <option value="pa_senate">PA Senate District</option>
        <option value="congressional">Congressional District</option>
        <option value="ward">Ward</option>
      </select>
      <label for="geoValue" style="margin-top:10px">Area</label>
      <select id="geoValue"></select>
      <button id="fitBtn" style="margin-top:9px">Fit selected area</button>
    </div>

    <div class="group">
      <div class="eyebrow">Data layer</div>
      <select id="dataLayer">
        <option value="none">None — geography only</option>
        <option value="wfp_shift">WFP · 2019 → 2023 · Council At-Large rank shift</option>
        <option value="wfp_vote_share_shift">WFP · 2019 → 2023 · citywide vote-share shift</option>
        <option value="amanda">2023 Primary · Amanda McIllmurray · % of DEM ballots</option>
        <option value="rabb">2026 Primary · Chris Rabb · % of PA-03 DEM vote</option>
        <option value="harris_trump_24g">2024 General · Kamala Harris vs Donald Trump · margin</option>
        <option value="dougherty_24g">2024 General · Sean Dougherty vs Aizaz Gill · PA House 172 margin</option>
        <option value="bernie_hillary">2016 Primary · Bernie Sanders vs Hillary Clinton · margin</option>
        <option value="trump_hillary">2016 General · Donald Trump vs Hillary Clinton · margin</option>
      </select>
      <div id="legend">
        <div id="legendTitle" class="legend-title"></div>
        <div id="legendRows"></div>
      </div>
      <div id="areaPerformance" class="area-performance"></div>
    </div>

    <div class="group">
      <div class="eyebrow">Polling places</div>
      <div class="toggle-only">
        <input id="pollingPlacesToggle" type="checkbox" aria-label="Polling places on or off">
      </div>
    </div>

    <div class="group">
      <div class="eyebrow">Background map</div>
      <div class="toggle-only">
        <input id="basemapToggle" type="checkbox" checked aria-label="Background map on or off">
      </div>
      <div class="slider-row">
        <input id="basemapTransparency" type="range" min="0" max="100" step="1" value="72" aria-label="Background map visibility">
      </div>

    <div class="group">
      <div class="eyebrow">Labels</div>
      <div class="checkrow"><input id="wardLabelsToggle" type="checkbox" checked><label for="wardLabelsToggle" style="margin:0">Ward</label></div>
      <div class="checkrow"><input id="divisionLabelsToggle" type="checkbox" checked><label for="divisionLabelsToggle" style="margin:0">Division</label></div>
    </div>

    <div class="group">
      <div class="eyebrow">Current view</div>

  </aside>
  <main id="map"></main>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// DAVY'S MAP EXPLORER v3.17
// LIVE DATA: Supabase project THE PORTAL.
// This is a publishable browser key, not a service-role or secret key.
const SUPABASE_URL = 'https://bxrxpiqyfnbahmqglkkc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KpTD5D2ISf9xPTLRC4_7vA_4F-0ZqA_';

const geoType = document.getElementById('geoType');
const geoValue = document.getElementById('geoValue');
const dataLayer = document.getElementById('dataLayer');
const status = document.getElementById('status');
const legend = document.getElementById('legend');
const legendTitle = document.getElementById('legendTitle');
const legendRows = document.getElementById('legendRows');
const areaPerformance = document.getElementById('areaPerformance');
const pollingPlacesToggle = document.getElementById('pollingPlacesToggle');
const basemapToggle = document.getElementById('basemapToggle');
const basemapTransparency = document.getElementById('basemapTransparency');
const addressForm = document.getElementById('addressForm');
const addressInput = document.getElementById('addressInput');
const addressSearchBtn = document.getElementById('addressSearchBtn');
const addressMeta = document.getElementById('addressMeta');
const addressClearBtn = document.getElementById('addressClearBtn');

let geographyOptions = {};
let currentPrecincts = {type:'FeatureCollection',features:[]};
let currentWards = {type:'FeatureCollection',features:[]};
let currentBoundary = {type:'FeatureCollection',features:[]};
let currentPollingPlaces = {type:'FeatureCollection',features:[]};
let requestSerial = 0;
let addressMarker = null;
let addressPopup = null;
let wfpRowsCache = null;
let wfpRowsPromise = null;
let wfpShareRowsCache = null;
let wfpShareRowsPromise = null;
const contestRowsCache = new Map();
const contestRowsPromise = new Map();

const PHILLY_ADDRESS_GEOCODER = 'https://citygeo-geocoder-pub.databridge.phila.gov/arcgis/rest/services/Geocoders/Philly_Composite_Locator/GeocodeServer/findAddressCandidates';
const PHILLY_PLACE_GEOCODER = 'https://citygeo-geocoder-pub.databridge.phila.gov/arcgis/rest/services/Geocoders/PPR_Composite/GeocodeServer/findAddressCandidates';
const PHILLY_BBOX = {minX:-75.30, maxX:-74.95, minY:39.84, maxY:40.16};
let addressCandidates = [];
let selectedAddressCandidate = -1;

function removeAddressMarker() {
  if (addressMarker) { addressMarker.remove(); addressMarker = null; }
  if (addressPopup) { addressPopup.remove(); addressPopup = null; }
  addressClearBtn.style.display='none';
}

function clearAddressPin(resetText=false) {
  removeAddressMarker();
  addressCandidates=[];
  selectedAddressCandidate=-1;
  addressMeta.classList.remove('is-error');
  addressMeta.textContent='';
  if (resetText) addressInput.value='';
}

function makeAddressMarkerElement() {
  const el=document.createElement('div');
  el.className='address-marker';
  el.setAttribute('aria-label','Located address or place');
  el.innerHTML=`<div class="address-marker-pin"></div><div class="address-marker-dot"></div>`;
  return el;
}

function cleanLocalQuery(value) {
  // The City's local locator does not need a ZIP, city, or state. Sending the street
  // address by itself is often more reliable, so strip trailing Philadelphia boilerplate.
  return String(value || '')
    .trim()
    .replace(/,?\s+philadelphia(?:,?\s+pa)?(?:\s+19\d{3})?\s*$/i,'')
    .replace(/,?\s+pa\s+19\d{3}\s*$/i,'')
    .trim();
}

function isLikelyAddressQuery(value) {
  const q=value.trim();
  return /^\d+\s/.test(q) || /\s(?:&|and|@)\s/i.test(q) || /\b(st|street|ave|avenue|rd|road|blvd|boulevard|dr|drive|ln|lane|ct|court|way|pike|pl|place)\b/i.test(q);
}

function isInPhillyBounds(location) {
  if (!location) return false;
  const x=Number(location.x), y=Number(location.y);
  return Number.isFinite(x) && Number.isFinite(y) &&
    x >= PHILLY_BBOX.minX && x <= PHILLY_BBOX.maxX &&
    y >= PHILLY_BBOX.minY && y <= PHILLY_BBOX.maxY;
}

async function fetchLocatorCandidates(endpoint, query, source) {
  const params=new URLSearchParams({
    SingleLine:cleanLocalQuery(query),
    f:'json',
    outSR:'4326',
    maxLocations:'8',
    outFields:'*'
  });
  const response=await fetch(`${endpoint}?${params.toString()}`);
  if (!response.ok) throw new Error(`Philadelphia search service returned ${response.status}`);
  const data=await response.json();
  if (data.error) throw new Error(data.error.message || 'Philadelphia search service error');
  return (data.candidates || [])
    .filter(c=>isInPhillyBounds(c.location))
    .map(c=>({...c,_source:source}));
}

function normalizeCandidate(candidate, query) {
  const a=candidate.attributes || {};
  const placeName=String(a.PlaceName || '').trim();
  const matched=String(candidate.address || a.Match_addr || '').trim();
  const street=String(a.StAddr || '').trim();
  const placeAddr=String(a.Place_addr || '').trim();
  const description=String(a.Descr || '').trim();
  const type=String(a.Type || a.Addr_type || '').trim();
  const isPlace=Boolean(placeName);
  const title=(placeName || matched || street || query).toUpperCase();
  let subtitle='';
  if (isPlace) subtitle=(placeAddr || street || matched || description).toUpperCase();
  else subtitle=[type, a.ZIP].filter(Boolean).join(' · ').toUpperCase();
  const score=Math.round(Number(candidate.score || 0));
  const addressLike=isLikelyAddressQuery(query);
  let rank=score;
  if (isPlace && !addressLike) rank += 20;
  if (!isPlace && addressLike && candidate._source==='address') rank += 12;
  if (placeName && placeName.toLowerCase()===query.trim().toLowerCase()) rank += 25;
  return {
    raw:candidate,
    lng:Number(candidate.location.x),
    lat:Number(candidate.location.y),
    title, subtitle, score, rank, isPlace,
    source:candidate._source,
    type
  };
}

function dedupeAndRankCandidates(candidates, query) {
  const normalized=candidates.map(c=>normalizeCandidate(c,query));
  normalized.sort((a,b)=>b.rank-a.rank || b.score-a.score);
  const seen=new Set();
  const out=[];
  for (const c of normalized) {
    // Deduplicate same physical match coming back from both composite locators.
    const key=`${c.lng.toFixed(5)}|${c.lat.toFixed(5)}|${c.title.replace(/[^A-Z0-9]/g,'')}`;
    const coordKey=`${c.lng.toFixed(5)}|${c.lat.toFixed(5)}`;
    if (seen.has(key)) continue;
    // If a named place and its plain street-address twin share a point, prefer the named place.
    const twinIndex=out.findIndex(x=>`${x.lng.toFixed(5)}|${x.lat.toFixed(5)}`===coordKey);
    if (twinIndex>=0 && c.isPlace && !out[twinIndex].isPlace) {
      out[twinIndex]=c;
      seen.add(key);
      continue;
    }
    if (twinIndex>=0 && !c.isPlace && out[twinIndex].isPlace) continue;
    seen.add(key);
    out.push(c);
    if (out.length>=6) break;
  }
  return out;
}

async function findPhiladelphiaMatches(query) {
  // Ask both City locators. The PPR composite can return named Parks & Recreation places;
  // the Philly composite is optimized for address/street/intersection matching.
  const settled=await Promise.allSettled([
    fetchLocatorCandidates(PHILLY_ADDRESS_GEOCODER,query,'address'),
    fetchLocatorCandidates(PHILLY_PLACE_GEOCODER,query,'place')
  ]);
  const candidates=[];
  let error=null;
  for (const result of settled) {
    if (result.status==='fulfilled') candidates.push(...result.value);
    else error=result.reason;
  }
  if (!candidates.length && error) throw error;
  return dedupeAndRankCandidates(candidates,query);
}

function candidateSourceLabel(candidate) {
  return candidate.isPlace ? 'CITY OF PHILADELPHIA PLACE SEARCH' : 'CITY OF PHILADELPHIA ADDRESS GEOCODER';
}

function pinCandidate(index, fly=true) {
  const candidate=addressCandidates[index];
  if (!candidate) return;
  removeAddressMarker();
  selectedAddressCandidate=index;

  const sub=candidate.subtitle ? `<div class="address-popup-sub">${escapeHtml(candidate.subtitle)}</div>` : '';
  addressPopup=new maplibregl.Popup({offset:30,closeButton:true})
    .setHTML(`<div class="address-popup-name">${escapeHtml(candidate.title)}</div>${sub}<div>${candidate.isPlace?'Place':'Address'} match · ${candidate.score}%</div><div class="address-popup-source">${candidateSourceLabel(candidate)}</div>`);
  addressMarker=new maplibregl.Marker({element:makeAddressMarkerElement(),anchor:'bottom'})
    .setLngLat([candidate.lng,candidate.lat])
    .setPopup(addressPopup)
    .addTo(map);

  addressMeta.classList.remove('is-error');
  addressMeta.textContent=candidate.title;
  addressClearBtn.style.display='inline-block';
  if (fly) map.flyTo({center:[candidate.lng,candidate.lat],zoom:candidate.isPlace?15.5:16,duration:750,essential:true});
}

async function searchAddress() {
  const query=addressInput.value.trim();
  if (!query) {
    addressMeta.textContent='Enter a Philadelphia address, intersection, park, or playground.';
    addressMeta.classList.add('is-error');
    addressInput.focus();
    return;
  }
  addressSearchBtn.disabled=true;
  addressMeta.classList.remove('is-error');
  addressMeta.textContent='Searching Philadelphia…';
  try {
    addressCandidates=await findPhiladelphiaMatches(query);
    if (!addressCandidates.length || Number(addressCandidates[0].score || 0) < 55) {
      throw new Error('No confident Philadelphia match found. Try a street number, intersection, park, playground, or recreation center name.');
    }
    pinCandidate(0,true);
  } catch (err) {
    console.error(err);
    removeAddressMarker();
    addressCandidates=[];
    addressMeta.classList.add('is-error');
    addressMeta.textContent=err.message || 'Philadelphia search failed.';
  } finally {
    addressSearchBtn.disabled=false;
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

async function rpc(name, args={}) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method:'POST',
    headers:{
      'apikey':SUPABASE_KEY,
      'Content-Type':'application/json'
    },
    body:JSON.stringify(args)
  });
  if (!response.ok) {
    const message = await response.text();
    throw new Error(`${name}: ${response.status} ${message}`);
  }
  return response.json();
}

// Simple local-only polygon sketch layer. Nothing is sent to Supabase or persisted.
let sketchMode=false;
let sketchCurrent=[];
let sketchCompleted=[];
let sketchControl=null;

function emptyFeatureCollection() { return {type:'FeatureCollection',features:[]}; }

function sketchPolygonFeatures() {
  return {
    type:'FeatureCollection',
    features:sketchCompleted.map((ring,i)=>({
      type:'Feature',
      properties:{sketch_id:i+1},
      geometry:{type:'Polygon',coordinates:[ring]}
    }))
  };
}

function sketchLineFeature() {
  if (sketchCurrent.length < 2) return emptyFeatureCollection();
  return {type:'FeatureCollection',features:[{
    type:'Feature',properties:{},geometry:{type:'LineString',coordinates:sketchCurrent}
  }]};
}

function sketchVertexFeatures() {
  return {
    type:'FeatureCollection',
    features:sketchCurrent.map((coord,i)=>({
      type:'Feature',
      properties:{is_first:i===0},
      geometry:{type:'Point',coordinates:coord}
    }))
  };
}

function updateSketchSources() {
  const polygons=map.getSource('sketch-polygons');
  const line=map.getSource('sketch-line');
  const vertices=map.getSource('sketch-vertices');
  if (polygons) polygons.setData(sketchPolygonFeatures());
  if (line) line.setData(sketchLineFeature());
  if (vertices) vertices.setData(sketchVertexFeatures());
  if (sketchControl) sketchControl.refresh();
}

function setSketchMode(enabled) {
  sketchMode=Boolean(enabled);
  map.getCanvas().style.cursor=sketchMode?'crosshair':'';
  if (sketchControl) sketchControl.refresh();
}

function undoSketchClick() {
  if (sketchCurrent.length) {
    sketchCurrent.pop();
  } else if (sketchCompleted.length) {
    // First undo after closing a polygon reopens it; another undo removes its last vertex.
    const ring=sketchCompleted.pop();
    sketchCurrent=ring.slice(0,-1);
  }
  updateSketchSources();
}

function clearSketches() {
  sketchCurrent=[];
  sketchCompleted=[];
  updateSketchSources();
}

function sketchCanClose(clickPoint) {
  if (sketchCurrent.length < 3) return false;
  const first=map.project({lng:sketchCurrent[0][0],lat:sketchCurrent[0][1]});
  return Math.hypot(clickPoint.x-first.x,clickPoint.y-first.y) <= 14;
}

class SketchControl {
  onAdd(mapInstance) {
    this.map=mapInstance;
    this.container=document.createElement('div');
    this.container.className='maplibregl-ctrl maplibregl-ctrl-group draw-ctrl';

    this.drawBtn=document.createElement('button');
    this.drawBtn.type='button';
    this.drawBtn.innerHTML='✎';
    this.drawBtn.title='Draw polygons';
    this.drawBtn.setAttribute('aria-label','Draw polygons');
    this.drawBtn.addEventListener('click',()=>setSketchMode(!sketchMode));

    this.undoBtn=document.createElement('button');
    this.undoBtn.type='button';
    this.undoBtn.innerHTML='↶';
    this.undoBtn.title='Undo last polygon click';
    this.undoBtn.setAttribute('aria-label','Undo last polygon click');
    this.undoBtn.addEventListener('click',undoSketchClick);

    this.clearBtn=document.createElement('button');
    this.clearBtn.type='button';
    this.clearBtn.className='draw-clear';
    this.clearBtn.innerHTML='×';
    this.clearBtn.title='Clear drawn polygons';
    this.clearBtn.setAttribute('aria-label','Clear drawn polygons');
    this.clearBtn.addEventListener('click',clearSketches);

    this.container.append(this.drawBtn,this.undoBtn,this.clearBtn);
    this.refresh();
    return this.container;
  }
  refresh() {
    if (!this.container) return;
    this.drawBtn.classList.toggle('is-active',sketchMode);
    this.drawBtn.title=sketchMode?'Stop drawing':'Draw polygons';
    this.undoBtn.disabled=!(sketchCurrent.length || sketchCompleted.length);
    this.clearBtn.disabled=!(sketchCurrent.length || sketchCompleted.length);
  }
  onRemove() {
    this.container?.remove();
    this.map=null;
  }
}

    '6':'#17A2B8','7':'#E377C2','8':'#8C564B','9':'#BCBD22','10':'#4B5CC4'

    '177':'#E377C2','179':'#7F7F7F','180':'#BCBD22','181':'#17BECF','182':'#393B79','184':'#637939',
    '185':'#8C6D31','186':'#843C39','188':'#7B4173','190':'#3182BD','191':'#31A354','192':'#756BB1',
    '194':'#E6550D','195':'#636363','197':'#6BAED6','198':'#74C476','200':'#9E9AC8','201':'#FD8D3C',

  },
  congressional: {
    '2':'#1F77B4','3':'#D62728','5':'#2CA02C'
  }
};

function districtColor(type, value) {
  const keyed=DISTRICT_COLORS[type] || {};
  return keyed[String(value)] || '#4F3B83';
}

function districtColorExpression(type) {
  const keyed=DISTRICT_COLORS[type] || {};
  const expression=['match',['to-string',['get','district_number']]];
  Object.entries(keyed).forEach(([district,color])=>expression.push(district,color));
  expression.push('#4F3B83');
  return expression;
}

let selectedAllDistrictId=null;

function updateSelectedDistrictHighlight(districtId=null) {

function applyBoundaryStyle() {
  if (!map.getLayer('selected-boundary-line')) return;
  const all=isAllDistricts();
  const color=all
    ? districtColorExpression(geoType.value)
    : (ALL_DISTRICT_TYPES.has(geoType.value) ? districtColor(geoType.value,geoValue.value) : '#4F3B83');

  map.setPaintProperty('selected-boundary-line','line-color',color);
  map.setPaintProperty('selected-boundary-line','line-offset',all
    ? ['interpolate',['linear'],['zoom'],8,2.0,12,2.6,15,3.2]
    : 0);
  map.setPaintProperty('selected-boundary-line','line-width',all
    ? ['interpolate',['linear'],['zoom'],8,2.4,12,3.0,15,3.6]
    : ['interpolate',['linear'],['zoom'],8,2.6,12,3.5]);

  if (map.getLayer('selected-boundary-fill')) {
    map.setPaintProperty('selected-boundary-fill','fill-color',all ? districtColorExpression(geoType.value) : '#4F3B83');
    map.setPaintProperty('selected-boundary-fill','fill-opacity',all ? 0.085 : 0);
    map.setLayoutProperty('selected-boundary-fill','visibility',all ? 'visible' : 'none');
  }

  if (map.getLayer('selected-boundary-casing')) {
    map.setPaintProperty('selected-boundary-casing','line-color','#ffffff');
    map.setPaintProperty('selected-boundary-casing','line-offset',0);
    map.setPaintProperty('selected-boundary-casing','line-width',all
      ? ['interpolate',['linear'],['zoom'],8,1.5,12,2.0,15,2.4]
      : ['interpolate',['linear'],['zoom'],8,4.4,12,5.4]);
    map.setPaintProperty('selected-boundary-casing','line-opacity',all ? 0.98 : 0.82);
  }

  if (map.getLayer('selected-boundary-highlight')) {
    map.setLayoutProperty('selected-boundary-highlight','visibility',all ? 'visible' : 'none');
    map.setPaintProperty('selected-boundary-highlight','line-width',
      ['interpolate',['linear'],['zoom'],8,5.4,12,7.0,15,8.2]);
    map.setPaintProperty('selected-boundary-highlight','line-opacity',all ? 0.98 : 0);
  }

  if (map.getLayer('selected-boundary-hitbox')) {
    map.setLayoutProperty('selected-boundary-hitbox','visibility',all ? 'visible' : 'none');
  }
}

function bringSketchLayersToFront() {
  ['sketch-polygon-fill','sketch-polygon-line','sketch-active-line','sketch-vertices'].forEach(id=>{
    if (map.getLayer(id)) map.moveLayer(id);
  });
}

function updateBoundaryLayerOrder() {
  if (!map.getLayer('selected-boundary-line')) return;
  if (isAllDistricts()) {
    // ALL districts remain the top data-interaction layer so district clicks win over precinct clicks.
    // Sketch graphics are then drawn visually above it; their normal layer clicks are disabled while drawing.
    if (map.getLayer('selected-boundary-fill')) map.moveLayer('selected-boundary-fill');
    if (map.getLayer('selected-boundary-casing')) map.moveLayer('selected-boundary-casing');
    map.moveLayer('selected-boundary-line');
    if (map.getLayer('selected-boundary-highlight')) map.moveLayer('selected-boundary-highlight');
    if (map.getLayer('selected-boundary-hitbox')) map.moveLayer('selected-boundary-hitbox');
  } else {
    // Restore the normal selected-area boundary beneath labels/points outside ALL mode.
    const before=map.getLayer('ward-labels') ? 'ward-labels' : undefined;
    if (before) {
      if (map.getLayer('selected-boundary-fill')) map.moveLayer('selected-boundary-fill',before);
      if (map.getLayer('selected-boundary-casing')) map.moveLayer('selected-boundary-casing',before);
      map.moveLayer('selected-boundary-line',before);
      if (map.getLayer('selected-boundary-highlight')) map.moveLayer('selected-boundary-highlight',before);
      if (map.getLayer('selected-boundary-hitbox')) map.moveLayer('selected-boundary-hitbox',before);
    }
  }
  bringSketchLayersToFront();
}

function walkCoords(coords, callback) {
  if (!Array.isArray(coords)) return;
  if (coords.length >= 2 && typeof coords[0] === 'number' && typeof coords[1] === 'number') {
    callback(coords[0], coords[1]);
    return;
  }
  coords.forEach(c => walkCoords(c, callback));
}

function bboxForFeatureCollection(fc) {
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  (fc.features || []).forEach(f => {
    if (!f.geometry) return;
    walkCoords(f.geometry.coordinates,(x,y)=>{
      minX=Math.min(minX,x); minY=Math.min(minY,y);
      maxX=Math.max(maxX,x); maxY=Math.max(maxY,y);
    });
  });
  return Number.isFinite(minX) ? [minX,minY,maxX,maxY] : null;
}

function wardLabelPoints(wards) {
  return {
    type:'FeatureCollection',
    features:(wards.features || []).map(f => {
      const box=bboxForFeatureCollection({type:'FeatureCollection',features:[f]});
      return {
        type:'Feature',
        properties:{label:f.properties.ward},
        geometry:{type:'Point',coordinates:[(box[0]+box[2])/2,(box[1]+box[3])/2]}
      };
    })
  };
}

    f.properties.wfp_share_23_pct = r && r.wfp_share_23_pct != null ? Number(r.wfp_share_23_pct) : null;
    f.properties.wfp_share_shift_pp = r && r.wfp_share_shift_pp != null ? Number(r.wfp_share_shift_pp) : null;
  });
  map.getSource('precincts').setData(targetPrecincts);
}

async function getContestRows(contestId) {
  if (contestRowsCache.has(contestId)) return contestRowsCache.get(contestId);
  if (!contestRowsPromise.has(contestId)) {
    const pending=rpc('map_contest_precinct_performance',{p_contest_id:contestId})
      .then(rows => {
        contestRowsCache.set(contestId,rows);
        return rows;
      })
      .finally(() => contestRowsPromise.delete(contestId));
    contestRowsPromise.set(contestId,pending);
  }
  return contestRowsPromise.get(contestId);
}

function contestCandidate(rows,candidateId) {
  return (rows||[]).find(r => String(r.candidate_id||'')===candidateId) || null;
}

async function loadContestRace({contestId,prefix,candidateAId,candidateBId}) {
  const targetPrecincts=currentPrecincts;
  const rows=await getContestRows(contestId);
  if (currentPrecincts!==targetPrecincts) return;
  const byDivision=new Map(rows.map(r=>[String(r.division_code).trim(),r]));
  targetPrecincts.features.forEach(f=>{
    const r=byDivision.get(String(f.properties.division_code).trim());
    const candidateResults=r ? parseCandidateResults(r.candidate_results) : [];
    f.properties[`${prefix}_candidate_results`]=candidateResults;
    f.properties[`${prefix}_contest_total_votes`]=r && r.contest_total_votes!=null ? Number(r.contest_total_votes) : null;
    const a=contestCandidate(candidateResults,candidateAId);
    const b=contestCandidate(candidateResults,candidateBId);
    const aPct=a && a.pct!=null ? Number(a.pct) : null;
    const bPct=b && b.pct!=null ? Number(b.pct) : null;
    f.properties[`${prefix}_margin_pp`]=(aPct!=null && bPct!=null) ? aPct-bPct : null;
  });
  map.getSource('precincts').setData(targetPrecincts);
}

function parseCandidateResults(raw) {
  if (Array.isArray(raw)) return raw;
  if (typeof raw === 'string') {
    try {
      const parsed=JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) { return []; }
  }
  return [];
}

function competitionRanks(rows) {
  const named=rows.filter(r=>!r.isWriteIn).sort((a,b)=>b.votes-a.votes || a.name.localeCompare(b.name));
  let lastVotes=null, lastRank=0;
  named.forEach((r,i)=>{
    if (lastVotes===null || Math.abs(r.votes-lastVotes)>1e-8) lastRank=i+1;
    r.rank=lastRank;
    lastVotes=r.votes;
  });
  const counts=new Map();
  named.forEach(r=>counts.set(r.rank,(counts.get(r.rank)||0)+1));
  named.forEach(r=>r.isTied=(counts.get(r.rank)||0)>1);
  return [...named,...rows.filter(r=>r.isWriteIn)];
}

function aggregateCandidateProperty(propertyName) {
  const totals=new Map();
  let included=0;
  for (const f of (currentPrecincts.features||[])) {
    const rows=parseCandidateResults(f.properties?.[propertyName]);
    if (!rows.length) continue;
    included++;
    for (const row of rows) {
      const isWriteIn=row.candidate_id==null || String(row.candidate_name||'').toUpperCase()==='WRITE-IN';
      const key=isWriteIn?'WRITE-IN':String(row.candidate_id||row.candidate_name);
      if (!totals.has(key)) totals.set(key,{
        key,
        candidateId:row.candidate_id||null,
        name:String(row.candidate_name||'WRITE-IN'),
        votes:0,
        isWriteIn
      });
      totals.get(key).votes += Number(row.votes||0);
    }
  }
  const rows=[...totals.values()];
  const contestTotal=rows.reduce((sum,r)=>sum+r.votes,0);
  rows.forEach(r=>r.pct=contestTotal>0 ? 100*r.votes/contestTotal : null);
  return {rows:competitionRanks(rows),contestTotal,included,totalSelected:(currentPrecincts.features||[]).length};
}

function areaRankLabel(row) {
  if (!row || row.isWriteIn || row.rank==null) return '—';
  const n=Number(row.rank);
  const mod100=n%100;
  const suffix=(mod100>=11 && mod100<=13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n%10] || 'th');
  const label=`${n}${suffix}`;
  return row.isTied ? `T-${label}` : label;
}

function areaRaceTable(summary, highlightCandidateId=null, voteLabel='Votes') {
  const rows=summary.rows || [];
  const highlightIds=new Set(Array.isArray(highlightCandidateId) ? highlightCandidateId : (highlightCandidateId ? [highlightCandidateId] : []));
  const header=`<div class="area-columns"><span>Rank</span><span>Candidate</span><span>Percent</span><span>${escapeHtml(voteLabel)}</span></div>`;
  const body=rows.map(row=>{
    const cls=highlightIds.has(row.candidateId)?' area-highlight':'';
    const votes=Math.round(Number(row.votes||0)).toLocaleString();
    const pct=row.pct==null?'—':`${Number(row.pct).toFixed(1)}%`;
    return `<div class="area-row${cls}">
      <div class="area-rank">${areaRankLabel(row)}</div>
      <div class="area-name">${escapeHtml(row.name)}</div>
      <div class="area-pct">${pct}</div>
      <div class="area-votes">${votes}</div>
    </div>`;
  }).join('');
  return header+body;
}

        <div>Unchanged divisions</div><div class="v">${unchanged.toLocaleString()}</div>
        <div>Declined divisions</div><div class="v">${declined.toLocaleString()}</div>
        <div>Average combined-rank shift</div><div class="v">${n?((sum/n)>0?'+':'')+(sum/n).toFixed(1):'—'}</div>
      </div>`;
  } else if (layer==='wfp_vote_share_shift') {
    let votes19=0,votes23=0,share19=0,share23=0,shift=0,n=0;
    for (const f of (currentPrecincts.features||[])) {
      const p=f.properties||{};
      const s19=Number(p.wfp_share_19_pct);
      const s23=Number(p.wfp_share_23_pct);
      const sh=Number(p.wfp_share_shift_pp);
      if (!Number.isFinite(s19) || !Number.isFinite(s23) || !Number.isFinite(sh)) continue;
      votes19 += Number(p.wfp_votes_19||0);
      votes23 += Number(p.wfp_votes_23||0);
      share19 += s19;
      share23 += s23;
      shift += sh;
      n++;
    }
    const shiftLabel=n ? `${shift>0?'+':''}${shift.toFixed(3)} pp` : '—';
    html=`<div class="area-performance-head">Area performance</div>
      <div class="area-performance-area">${escapeHtml(area)}</div>
      <div class="area-performance-sub">Share of citywide Brooks + O’Rourke vote · 2019 → 2023</div>
      <div class="area-stat-grid">
        <div>2019 WFP votes</div><div class="v">${votes19.toLocaleString()}</div>
        <div>2019 share of citywide WFP vote</div><div class="v">${n?share19.toFixed(3)+'%':'—'}</div>
        <div>2023 WFP votes</div><div class="v">${votes23.toLocaleString()}</div>
        <div>2023 share of citywide WFP vote</div><div class="v">${n?share23.toFixed(3)+'%':'—'}</div>
        <div>Vote-share shift</div><div class="v">${shiftLabel}</div>
      </div>`;
  }

  areaPerformance.innerHTML=html;
  areaPerformance.classList.toggle('is-visible',Boolean(html));
}

async function fetchPollingPlaces(args) {
  if (!pollingPlacesToggle.checked) return {type:'FeatureCollection',features:[]};
  return rpc('map_polling_places_geojson',{
    ...args,
    p_election_id:'26P'
  });
}

function setPollingVisibility() {
  if (!map.getLayer('polling-place-stars')) return;
  map.setLayoutProperty('polling-place-stars','visibility',pollingPlacesToggle.checked ? 'visible' : 'none');
}

async function updatePollingPlaces() {
  if (!map.getSource('polling-places')) return;
  if (!pollingPlacesToggle.checked) {
    currentPollingPlaces={type:'FeatureCollection',features:[]};
    map.getSource('polling-places').setData(currentPollingPlaces);
    setPollingVisibility();
    updateStatus();
    return;
  }
  const serial=requestSerial;
  try {
    const fc=await fetchPollingPlaces(geographyArgs());
    if (serial!==requestSerial || !pollingPlacesToggle.checked) return;
    currentPollingPlaces=fc;
    map.getSource('polling-places').setData(currentPollingPlaces);
    setPollingVisibility();
    updateStatus();
  } catch (err) {
    console.error(err);
    status.innerHTML=`<strong>Polling-place layer error</strong><br>${err.message}`;
  }
}

async function loadGeography(doFit=true) {
  updateSelectedDistrictHighlight(null);
  const serial=++requestSerial;
  status.innerHTML='<strong>Loading live geography…</strong>';
  geoType.disabled=true;
  geoValue.disabled=true;

  try {
    const args=geographyArgs();
    const [precincts,wards,boundary,pollingPlaces] = await Promise.all([
      rpc('map_precinct_geojson',args),
      rpc('map_ward_geojson',args),
      rpc('map_selected_boundary_geojson',boundaryArgs()),
      fetchPollingPlaces(args)
    ]);
    if (serial !== requestSerial) return;

    currentPrecincts=precincts;
    currentWards=wards;
    currentBoundary=boundary;
    currentPollingPlaces=pollingPlaces;

    map.getSource('precincts').setData(currentPrecincts);
    map.getSource('wards').setData(currentWards);
    map.getSource('ward-label-points').setData(wardLabelPoints(currentWards));
    map.getSource('selected-boundary').setData(currentBoundary);
    map.getSource('polling-places').setData(currentPollingPlaces);
    applyBoundaryStyle();
    updateBoundaryLayerOrder();
    setPollingVisibility();

    updateStatus();
    if (dataLayer.value!=='none') await updateDataLayer();
    else await updateAreaPerformance();
    if (doFit) fitSelected();
  } catch (err) {
    console.error(err);
    status.innerHTML=`<strong>Supabase connection error</strong><br>${err.message}`;
  } finally {
    if (serial === requestSerial) {
      geoType.disabled=false;
      geoValue.disabled = geoType.value==='citywide';
    }
  }
}

function updateBasemap() {
  if (!map.getLayer('basemap')) return;
  const enabled=basemapToggle.checked;
  const visibility=Number(basemapTransparency.value);
  const opacity=enabled ? Math.max(0,Math.min(1,visibility/100)) : 0;
  map.setPaintProperty('basemap','raster-opacity',opacity);
  basemapTransparency.disabled=!enabled;
}

    if (sketchMode) return;
    if (pollingPlacesToggle.checked && map.queryRenderedFeatures(e.point,{layers:['polling-place-stars']}).length) return;
    if (isAllDistricts() && map.queryRenderedFeatures(e.point,{layers:['selected-boundary-hitbox']}).length) return;
    const p=e.features[0].properties;
    let metric='';
    if (dataLayer.value==='amanda') {
      const pct=p.amanda_support_pct==null?'—':Number(p.amanda_support_pct).toFixed(1)+'%';
      const rank=p.amanda_rank==null?'—':areaRankLabel({rank:Number(p.amanda_rank),isTied:p.amanda_is_tied===true || p.amanda_is_tied==='true',isWriteIn:false});
      const candidateCount=Number(p.amanda_named_candidate_count||27);
      metric=`<div>Amanda rank</div><div class="v">${rank}${rank==='—'?'':` of ${candidateCount}`}</div>
              <div>Amanda votes</div><div class="v">${Number(p.amanda_actual_votes||0).toLocaleString()}</div>
              <div>DEM ballots</div><div class="v">${Number(p.dem_ballots_cast||0).toLocaleString()}</div>
              <div>Support</div><div class="v">${pct}</div>`;
    }
    const wfp=dataLayer.value==='wfp_shift' ? `
      <div class="wfp-popup">
        <div class="wfp-cycle">
          <div class="wfp-year">2019</div>
          <div class="wfp-name">KENDRA BROOKS</div>${rankHtml(p.wfp_brooks_19_rank)}
          <div class="wfp-name">NIC O'ROURKE</div>${rankHtml(p.wfp_orourke_19_rank)}
        </div>
        <div class="wfp-cycle">
          <div class="wfp-year">2023</div>
          <div class="wfp-name">KENDRA BROOKS</div>${rankHtml(p.wfp_brooks_23_rank)}
          <div class="wfp-name">NIC O'ROURKE</div>${rankHtml(p.wfp_orourke_23_rank)}
        </div>
        <div class="wfp-shift"><span>WFP rank shift</span>${shiftHtml(p.wfp_rank_shift)}</div>
      </div>` : '';
    const wfpShare=dataLayer.value==='wfp_vote_share_shift' ? `
      <div class="wfp-popup">
        <div class="popup-grid">
          <div>2019 WFP votes</div><div class="v">${Number(p.wfp_votes_19||0).toLocaleString()}</div>
          <div>2019 share of citywide WFP</div><div class="v">${p.wfp_share_19_pct==null?'—':Number(p.wfp_share_19_pct).toFixed(3)+'%'}</div>
          <div>2023 WFP votes</div><div class="v">${Number(p.wfp_votes_23||0).toLocaleString()}</div>
          <div>2023 share of citywide WFP</div><div class="v">${p.wfp_share_23_pct==null?'—':Number(p.wfp_share_23_pct).toFixed(3)+'%'}</div>
        </div>
        <div class="wfp-shift"><span>Vote-share shift</span>${shareShiftHtml(p.wfp_share_shift_pp)}</div>
      </div>` : '';
    const rabb=dataLayer.value==='rabb' ? rabbPopupHtml(p) : '';
    const bh16=dataLayer.value==='bernie_hillary' ? bh16PopupHtml(p) : '';
    const th16=dataLayer.value==='trump_hillary' ? th16PopupHtml(p) : '';
    const ht24=dataLayer.value==='harris_trump_24g' ? contestRacePopupHtml(p,{
      propertyName:'ht24_candidate_results',marginProperty:'ht24_margin_pp',
      heading:'2024 PRESIDENTIAL GENERAL',positiveName:'HARRIS',negativeName:'TRUMP',
      highlightIds:['HARRIS-VEEU','TRUMP-XB4V']
    }) : '';
    const dg24=dataLayer.value==='dougherty_24g' ? contestRacePopupHtml(p,{
      propertyName:'dg24_candidate_results',marginProperty:'dg24_margin_pp',
      heading:'2024 GENERAL · PA HOUSE 172',positiveName:'DOUGHERTY',negativeName:'GILL',
      highlightIds:['DOUGHERTY-R1U6','GILL-UH59']
    }) : '';
    new maplibregl.Popup({maxWidth:'380px'})
      .setLngLat(e.lngLat)
      .setHTML(`<div class="popup-title">DIVISION ${p.display_id}</div>
        <div class="popup-grid">
          <div>Ward</div><div class="v">${p.ward}</div>
          <div>Council</div><div class="v">${p.city_council_district ?? '—'}</div>
          <div>PA House</div><div class="v">${p.state_house_district ?? '—'}</div>
          ${metric}
        </div>${wfp}${wfpShare}${rabb}${ht24}${dg24}${bh16}${th16}`)
      .addTo(map);
  });
  map.on('mouseenter','precinct-fill',()=>map.getCanvas().style.cursor=sketchMode?'crosshair':'pointer');
  map.on('mouseleave','precinct-fill',()=>map.getCanvas().style.cursor=sketchMode?'crosshair':'');

  try {
    geographyOptions = await rpc('map_geography_options');
    populateAreas();
    await loadGeography(true);
    updateBasemap();
  } catch (err) {
    console.error(err);
    status.innerHTML=`<strong>Supabase connection error</strong><br>${err.message}`;
  }
});

geoType.addEventListener('change',async ()=>{
  populateAreas();
  await loadGeography(true);
});
geoValue.addEventListener('change',()=>loadGeography(true));
dataLayer.addEventListener('change',updateDataLayer);
pollingPlacesToggle.addEventListener('change',updatePollingPlaces);
document.getElementById('fitBtn').addEventListener('click',fitSelected);

addressForm.addEventListener('submit',e=>{ e.preventDefault(); searchAddress(); });
addressClearBtn.addEventListener('click',()=>clearAddressPin(true));

basemapToggle.addEventListener('change', updateBasemap);
basemapTransparency.addEventListener('input', updateBasemap);

document.getElementById('wardLabelsToggle').addEventListener('change',e=>{
  map.setLayoutProperty('ward-labels','visibility',e.target.checked?'visible':'none');
});
document.getElementById('divisionLabelsToggle').addEventListener('change',e=>{
  map.setLayoutProperty('division-labels','visibility',e.target.checked?'visible':'none');
});

document.addEventListener('keydown',e=>{
  if (e.key==='Escape' && sketchMode) {
    setSketchMode(false);
  } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='z' && sketchMode) {
    e.preventDefault();
    undoSketchClick();
  }
});
</script>
</body>
</html>
